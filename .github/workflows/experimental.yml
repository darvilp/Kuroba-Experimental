name: Experimental APKs

on:
  push:
    branches: [release/experimental]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified APKs as a GitHub prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: experimental-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'darvilp/Kuroba-Experimental' && github.ref == 'refs/heads/release/experimental'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check code and run unit tests
        working-directory: Kuroba
        run: >-
          bash ./gradlew detekt testDebugUnitTest
          --no-configuration-cache --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
          -Dorg.gradle.jvmargs="-Xmx4g -Xms512m -XX:MaxMetaspaceSize=1g"

  apk:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KUROBA_EXPERIMENTAL_KEYSTORE: ${{ runner.temp }}/experimental.p12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Load experimental signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.EXPERIMENTAL_KEYSTORE }}
          KUROBA_EXPERIMENTAL_STORE_PASSWORD: ${{ secrets.EXPERIMENTAL_STORE_PASSWORD }}
          KUROBA_EXPERIMENTAL_KEY_ALIAS: ${{ secrets.EXPERIMENTAL_KEY_ALIAS }}
          KUROBA_EXPERIMENTAL_KEY_PASSWORD: ${{ secrets.EXPERIMENTAL_KEY_PASSWORD }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KUROBA_EXPERIMENTAL_STORE_PASSWORD" || -z "$KUROBA_EXPERIMENTAL_KEY_ALIAS" || -z "$KUROBA_EXPERIMENTAL_KEY_PASSWORD" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            if [[ "$PUBLISH_REQUESTED" == 'true' ]]; then
              echo '::error::Configure all four EXPERIMENTAL signing secrets before requesting publication.'
              exit 1
            fi
            echo '::notice::Code verification passed; signed APKs are skipped until all four EXPERIMENTAL signing secrets are configured.'
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KUROBA_EXPERIMENTAL_KEYSTORE"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Install Android build tools
        if: steps.signing.outputs.ready == 'true'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build signed experimental APKs
        if: steps.signing.outputs.ready == 'true'
        working-directory: Kuroba
        env:
          KUROBA_EXPERIMENTAL_STORE_PASSWORD: ${{ secrets.EXPERIMENTAL_STORE_PASSWORD }}
          KUROBA_EXPERIMENTAL_KEY_ALIAS: ${{ secrets.EXPERIMENTAL_KEY_ALIAS }}
          KUROBA_EXPERIMENTAL_KEY_PASSWORD: ${{ secrets.EXPERIMENTAL_KEY_PASSWORD }}
        run: >-
          bash ./gradlew :app:assembleRelease -PbuildType=2 -PexperimentalRelease=true
          --no-configuration-cache --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
          -Dorg.gradle.jvmargs="-Xmx4g -Xms512m -XX:MaxMetaspaceSize=1g"
      - name: Verify identity, signer, source commit, and checksums
        if: steps.signing.outputs.ready == 'true'
        run: >-
          python3 scripts/prepare_experimental_release.py
          --apk-dir Kuroba/app/build/outputs/apk/release
          --output-dir release-assets
          --build-tools "$ANDROID_HOME/build-tools/36.0.0"
      - name: Retain verified APKs
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: experimental-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
      - name: Publish prerelease
        if: steps.signing.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_experimental_release.py --assets release-assets
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$KUROBA_EXPERIMENTAL_KEYSTORE"
